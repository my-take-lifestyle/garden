<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>庭DIY管理</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d6a3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="庭DIY管理">
<style>
:root{
  --primary:#2d6a3f;--primary-light:#4a9a5e;--primary-dark:#1a4a2a;
  --accent:#7cb87e;--bg:#f5f9f5;--card:#fff;
  --text:#1a1a1a;--sub:#666;--border:#e0e8e0;
  --danger:#e74c3c;--warn:#f39c12;
  --tab-h:60px;--hdr-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;
  background:var(--bg);color:var(--text);
  max-width:420px;margin:0 auto;min-height:100vh;overflow-x:hidden;
}

/* ── Header ── */
.hdr{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:420px;height:var(--hdr-h);
  background:var(--primary);color:#fff;
  display:flex;align-items:center;padding:0 16px;
  z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.hdr h1{font-size:18px;font-weight:700;flex:1;}
.hdr-btn{
  background:none;border:none;color:#fff;font-size:22px;
  cursor:pointer;padding:8px;border-radius:50%;
}

/* ── Tabs ── */
.tab-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:420px;height:var(--tab-h);
  background:var(--card);display:flex;
  border-top:1px solid var(--border);z-index:50;
  box-shadow:0 -2px 8px rgba(0,0,0,.1);
}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;cursor:pointer;
  color:var(--sub);font-size:10px;padding:8px 0;
  border:none;background:none;transition:color .2s;
}
.tab-item.active{color:var(--primary);}
.tab-icon{font-size:22px;}

/* ── Content ── */
.main{
  padding-top:calc(var(--hdr-h) + 8px);
  padding-bottom:calc(var(--tab-h) + 80px);
  min-height:100vh;
}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ── Cards & Lists ── */
.card{
  background:var(--card);border-radius:12px;padding:16px;
  margin:8px 12px;box-shadow:0 1px 4px rgba(0,0,0,.08);
}
.record-item{
  background:var(--card);border-radius:12px;margin:8px 12px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden;
  cursor:pointer;transition:transform .15s,box-shadow .15s;
}
.record-item:active{transform:scale(.98);}
.record-item.completed{opacity:.6;}
.record-item.overdue{border-left:4px solid var(--danger);}

.ri-head{padding:12px 16px;display:flex;align-items:flex-start;gap:10px;}
.ri-icon{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.type-soil .ri-icon{background:#e8d5b7;}
.type-plant .ri-icon{background:#d4edda;}
.type-task .ri-icon{background:#d1ecf1;}
.ri-info{flex:1;min-width:0;}
.ri-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ri-meta{font-size:12px;color:var(--sub);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;}
.ri-preview{padding:0 16px 12px;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── Badges ── */
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;}
.b-soil{background:#e8d5b7;color:#8b6914;}
.b-plant{background:#d4edda;color:#155724;}
.b-task{background:#d1ecf1;color:#0c5460;}
.b-new{background:#d4edda;color:#155724;}
.b-update{background:#cce5ff;color:#004085;}
.b-edit{background:#fff3cd;color:#856404;}
.b-done{background:#d6d8d9;color:#383d41;}
.b-overdue{background:#f8d7da;color:#721c24;}
.b-vegetable{background:#fff3cd;color:#856404;}
.b-flower{background:#f8d7da;color:#721c24;}
.b-herb{background:#d4edda;color:#155724;}
.b-tree{background:#c3e6cb;color:#1a4a2a;}
.b-other{background:#e2e3e5;color:#383d41;}
.overdue-txt{color:var(--danger)!important;font-weight:600;}

/* ── FAB ── */
.fab{
  position:fixed;
  bottom:calc(var(--tab-h) + 16px);
  right:max(16px,calc(50vw - 194px));
  width:56px;height:56px;border-radius:50%;
  background:var(--primary);color:#fff;font-size:28px;
  border:none;cursor:pointer;
  box-shadow:0 4px 12px rgba(45,106,63,.4);
  display:flex;align-items:center;justify-content:center;
  z-index:40;transition:transform .2s;
}
.fab:active{transform:scale(.92);}

/* ── Modal / Bottom sheet ── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;
}
.overlay.active{opacity:1;pointer-events:all;}
.sheet{
  position:fixed;bottom:0;left:50%;
  transform:translateX(-50%) translateY(100%);
  width:100%;max-width:420px;
  background:var(--card);border-radius:20px 20px 0 0;
  z-index:101;
  transition:transform .35s cubic-bezier(.32,.72,0,1);
  max-height:92vh;display:flex;flex-direction:column;
}
.sheet.active{transform:translateX(-50%) translateY(0);}
.sheet-handle{
  width:36px;height:4px;background:#ddd;
  border-radius:2px;margin:12px auto 0;flex-shrink:0;
}
.sheet-hdr{
  padding:12px 16px 8px;display:flex;align-items:center;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.sheet-title{font-size:17px;font-weight:700;flex:1;}
.sheet-close{background:none;border:none;font-size:24px;color:var(--sub);cursor:pointer;padding:4px;}
.sheet-body{overflow-y:auto;flex:1;padding:16px;-webkit-overflow-scrolling:touch;}

/* ── Forms ── */
.fg{margin-bottom:16px;}
.flabel{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:6px;}
.finput,.fselect,.ftextarea{
  width:100%;padding:10px 12px;
  border:1.5px solid var(--border);border-radius:10px;
  font-size:15px;font-family:inherit;color:var(--text);
  background:var(--bg);outline:none;transition:border-color .2s;
}
.finput:focus,.fselect:focus,.ftextarea:focus{border-color:var(--primary);}
.ftextarea{resize:none;min-height:80px;}

.type-sel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.type-btn{
  padding:12px 8px;border:2px solid var(--border);border-radius:12px;
  background:var(--bg);cursor:pointer;text-align:center;
  font-size:13px;font-family:inherit;transition:all .2s;
}
.type-btn .te{font-size:24px;display:block;margin-bottom:4px;}
.type-btn.sel{border-color:var(--primary);background:#e8f5e9;color:var(--primary);}

.btn-p{
  width:100%;padding:14px;background:var(--primary);color:#fff;
  border:none;border-radius:12px;font-size:16px;font-weight:600;
  font-family:inherit;cursor:pointer;margin-top:8px;transition:background .2s;
}
.btn-p:active{background:var(--primary-dark);}
.btn-s{
  width:100%;padding:12px;background:var(--bg);color:var(--primary);
  border:2px solid var(--primary);border-radius:12px;
  font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:8px;
}
.btn-d{
  background:var(--danger);color:#fff;border:none;
  border-radius:8px;padding:8px 14px;font-size:13px;font-family:inherit;cursor:pointer;
}
.btn-sm{
  padding:6px 12px;border:1.5px solid var(--primary);border-radius:8px;
  background:none;color:var(--primary);font-size:13px;font-family:inherit;cursor:pointer;
}

/* ── Zone tabs ── */
.zone-tabs{
  display:flex;overflow-x:auto;padding:8px 12px;gap:8px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.zone-tabs::-webkit-scrollbar{display:none;}
.ztab{
  flex-shrink:0;padding:6px 16px;border-radius:20px;
  border:1.5px solid var(--border);background:var(--card);
  font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all .2s;
}
.ztab.active{background:var(--primary);color:#fff;border-color:var(--primary);}

/* ── Filter bar ── */
.filter-bar{padding:8px 12px;display:flex;gap:8px;}
.filter-bar select{
  flex:1;padding:8px 10px;border:1.5px solid var(--border);
  border-radius:10px;font-size:13px;background:var(--card);
  font-family:inherit;outline:none;
}

/* ── Timeline ── */
.timeline{padding:0 12px 8px;}
.tl-entry{position:relative;padding-left:28px;padding-bottom:20px;}
.tl-entry::before{
  content:'';position:absolute;left:10px;top:22px;bottom:0;
  width:2px;background:var(--border);
}
.tl-entry:last-child::before{display:none;}
.tl-dot{
  position:absolute;left:4px;top:4px;width:14px;height:14px;
  border-radius:50%;background:var(--primary);
  border:2px solid var(--card);box-shadow:0 0 0 2px var(--primary);
}
.tl-card{background:var(--card);border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.tl-date{font-size:12px;color:var(--sub);margin-bottom:6px;}
.tl-comment{font-size:14px;line-height:1.5;white-space:pre-wrap;}
.tl-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px;}
.tl-photo{aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;width:100%;}
.tl-materials{margin-top:8px;padding:8px;background:var(--bg);border-radius:8px;}
.mat-item{font-size:13px;color:var(--sub);padding:2px 0;}

/* ── Material rows ── */
.mat-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
.mat-row .finput{flex:2;padding:8px 10px;font-size:13px;}
.mat-row .finput.amt{flex:1;}
.mat-row .fselect{flex:1;padding:8px 6px;font-size:12px;}
.rm-mat{background:none;border:none;color:var(--danger);font-size:20px;cursor:pointer;flex-shrink:0;padding:0 4px;}

/* ── Photo upload ── */
.photo-drop{
  border:2px dashed var(--border);border-radius:12px;
  padding:20px;text-align:center;cursor:pointer;
  color:var(--sub);font-size:14px;position:relative;
}
.photo-drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;}
.photo-item{position:relative;aspect-ratio:1;}
.photo-item img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
.rm-photo{
  position:absolute;top:-6px;right:-6px;width:22px;height:22px;
  border-radius:50%;background:var(--danger);color:#fff;
  border:none;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 12px;}
.stat-card{background:var(--card);border-radius:12px;padding:16px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.stat-n{font-size:32px;font-weight:700;color:var(--primary);}
.stat-l{font-size:12px;color:var(--sub);margin-top:4px;}

/* ── Section header ── */
.sec-hdr{font-size:13px;font-weight:700;color:var(--sub);padding:12px 16px 4px;text-transform:uppercase;letter-spacing:.5px;}

/* ── Task ── */
.task-item{background:var(--card);border-radius:12px;margin:8px 12px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden;}
.task-item.overdue{border-left:4px solid var(--danger);}
.task-item.done-task{opacity:.6;}
.task-inner{padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.task-chk{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;cursor:pointer;transition:all .2s;
}
.task-chk.done{background:var(--primary);border-color:var(--primary);color:#fff;}

/* ── Zone list ── */
.zone-list{margin:8px 12px;}
.zone-li{
  background:var(--card);border-radius:10px;padding:12px 16px;
  margin-bottom:6px;display:flex;align-items:center;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.zone-li span{flex:1;font-size:15px;}

/* ── Empty state ── */
.empty{text-align:center;padding:48px 24px;color:var(--sub);}
.empty .ei{font-size:48px;margin-bottom:12px;}
.empty p{font-size:14px;}

/* ── Image viewer ── */
.img-viewer{
  position:fixed;inset:0;background:rgba(0,0,0,.95);
  z-index:200;display:none;align-items:center;justify-content:center;
}
.img-viewer img{max-width:100%;max-height:100%;object-fit:contain;}
.iv-close{position:absolute;top:16px;right:16px;background:none;border:none;color:#fff;font-size:32px;cursor:pointer;}

/* ── Toast ── */
.toast{
  position:fixed;bottom:calc(var(--tab-h) + 80px);
  left:50%;transform:translateX(-50%) translateY(20px);
  background:#333;color:#fff;padding:10px 20px;
  border-radius:20px;font-size:14px;z-index:300;
  opacity:0;transition:all .3s;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── Misc ── */
.spinner{
  display:inline-block;width:20px;height:20px;
  border:2px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading{display:flex;align-items:center;justify-content:center;padding:20px;gap:8px;color:var(--sub);font-size:14px;}
.sync-status{text-align:center;font-size:12px;color:var(--sub);padding:6px 0;}
.add-tl-btn{
  display:block;width:calc(100% - 24px);margin:8px 12px;padding:12px;
  border:2px dashed var(--primary);border-radius:12px;
  background:none;color:var(--primary);font-size:14px;font-weight:600;
  font-family:inherit;cursor:pointer;text-align:center;
}
.del-btn{width:100%;background:var(--danger);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-family:inherit;cursor:pointer;margin-top:8px;}
</style>
</head>
<body>

<header class="hdr">
  <h1>🌿 庭DIY管理</h1>
  <button class="hdr-btn" id="syncBtn" title="データを取得">☁️</button>
</header>

<main class="main">
  <!-- 全体 -->
  <div class="tab-panel active" id="panel-all">
    <div class="filter-bar">
      <select id="filterType">
        <option value="">すべてのカテゴリ</option>
        <option value="soil">土づくり</option>
        <option value="plant">植物</option>
        <option value="task">タスク</option>
      </select>
      <select id="filterZone"><option value="">すべてのゾーン</option></select>
    </div>
    <div id="allList"></div>
  </div>

  <!-- 土づくり -->
  <div class="tab-panel" id="panel-soil">
    <div class="zone-tabs" id="soilZoneTabs"></div>
    <div id="soilList"></div>
  </div>

  <!-- 植物 -->
  <div class="tab-panel" id="panel-plant">
    <div class="zone-tabs" id="plantZoneTabs"></div>
    <div id="plantList"></div>
  </div>

  <!-- タスク -->
  <div class="tab-panel" id="panel-task">
    <div id="taskList"></div>
  </div>

  <!-- まとめ -->
  <div class="tab-panel" id="panel-summary">
    <div class="stats-grid" id="statsGrid"></div>

    <div class="sec-hdr">ゾーン管理</div>
    <div class="zone-list" id="zoneList"></div>
    <div style="margin:0 12px 4px;">
      <button class="btn-s" onclick="showZoneSheet()">＋ ゾーンを追加</button>
    </div>

    <div class="sec-hdr">GitHub 同期設定</div>
    <div class="card">
      <div class="fg">
        <label class="flabel">Personal Access Token</label>
        <input type="password" class="finput" id="ghToken" placeholder="ghp_...">
      </div>
      <div class="fg">
        <label class="flabel">リポジトリ (owner/repo)</label>
        <input type="text" class="finput" id="ghRepo" placeholder="username/garden-data">
      </div>
      <div class="fg">
        <label class="flabel">ファイルパス</label>
        <input type="text" class="finput" id="ghPath" value="garden-data.json">
      </div>
      <button class="btn-p" onclick="saveGhSettings()">設定を保存</button>
      <button class="btn-s" onclick="syncToGh()">今すぐ同期（アップロード）</button>
      <button class="btn-s" onclick="syncFromGh()">データを取得（ダウンロード）</button>
      <div class="sync-status" id="syncStatus"></div>
    </div>

    <div class="sec-hdr">バックアップ</div>
    <div class="card">
      <button class="btn-s" onclick="exportJSON()" style="margin-top:0">JSONエクスポート</button>
      <label style="display:block;margin-top:8px;position:relative;">
        <span class="btn-s" style="display:block;text-align:center;cursor:pointer;">JSONインポート</span>
        <input type="file" accept=".json" style="position:absolute;inset:0;opacity:0;cursor:pointer;" onchange="importJSON(event)">
      </label>
    </div>
    <div style="height:24px;"></div>
  </div>
</main>

<nav class="tab-bar">
  <button class="tab-item active" data-tab="all"><span class="tab-icon">📋</span><span>全体</span></button>
  <button class="tab-item" data-tab="soil"><span class="tab-icon">🪨</span><span>土づくり</span></button>
  <button class="tab-item" data-tab="plant"><span class="tab-icon">🌱</span><span>植物</span></button>
  <button class="tab-item" data-tab="task"><span class="tab-icon">✅</span><span>タスク</span></button>
  <button class="tab-item" data-tab="summary"><span class="tab-icon">📊</span><span>まとめ</span></button>
</nav>

<button class="fab" id="fabBtn">＋</button>
<div class="toast" id="toast"></div>

<!-- ── Add Record Sheet ── -->
<div class="overlay" id="addOverlay"></div>
<div class="sheet" id="addSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-hdr">
    <span class="sheet-title">新規追加</span>
    <button class="sheet-close" onclick="closeSheet('add')">×</button>
  </div>
  <div class="sheet-body" id="addBody"></div>
</div>

<!-- ── Detail Sheet ── -->
<div class="overlay" id="detailOverlay"></div>
<div class="sheet" id="detailSheet" style="max-height:96vh;">
  <div class="sheet-handle"></div>
  <div class="sheet-hdr">
    <span class="sheet-title" id="detailTitle"></span>
    <button class="sheet-close" onclick="closeSheet('detail')">×</button>
  </div>
  <div class="sheet-body" id="detailBody"></div>
</div>

<!-- ── Timeline Entry Sheet ── -->
<div class="overlay" id="tlOverlay"></div>
<div class="sheet" id="tlSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-hdr">
    <span class="sheet-title">追記する</span>
    <button class="sheet-close" onclick="closeSheet('tl')">×</button>
  </div>
  <div class="sheet-body" id="tlBody"></div>
</div>

<!-- ── Zone Sheet ── -->
<div class="overlay" id="zoneOverlay"></div>
<div class="sheet" id="zoneSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-hdr">
    <span class="sheet-title">ゾーンを追加</span>
    <button class="sheet-close" onclick="closeSheet('zone')">×</button>
  </div>
  <div class="sheet-body">
    <div class="fg">
      <label class="flabel">ゾーン名</label>
      <input type="text" class="finput" id="newZoneName" placeholder="例: ロックガーデン">
    </div>
    <button class="btn-p" onclick="addZone()">追加</button>
  </div>
</div>

<!-- ── Image viewer ── -->
<div class="img-viewer" id="imgViewer" onclick="closeViewer()">
  <button class="iv-close" onclick="closeViewer()">×</button>
  <img id="viewerImg" src="" alt="">
</div>

<script>
// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let S = { zones:[], records:[], gh:{} };
let curTab = 'all';
let soilZone = 'all';
let plantZone = 'all';
let addPhotos = [];   // [{id,blob,url}]
let tlPhotos  = [];
let curRecId  = null;

// ═══════════════════════════════════════════
// PHOTO DB (IndexedDB)
// ═══════════════════════════════════════════
const PDB = (() => {
  let db = null;
  function open() {
    return new Promise((res,rej) => {
      const r = indexedDB.open('GardenPhotoDB',1);
      r.onupgradeneeded = e => e.target.result.createObjectStore('photos');
      r.onsuccess = e => { db = e.target.result; res(); };
      r.onerror = () => rej(r.error);
    });
  }
  function put(id, blob) {
    return new Promise((res,rej) => {
      const tx = db.transaction('photos','readwrite');
      tx.objectStore('photos').put(blob, id);
      tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
    });
  }
  function url(id) {
    return new Promise((res,rej) => {
      const tx = db.transaction('photos','readonly');
      const r = tx.objectStore('photos').get(id);
      r.onsuccess = () => res(r.result ? URL.createObjectURL(r.result) : null);
      r.onerror = ()=>rej(r.error);
    });
  }
  function del(id) {
    return new Promise((res,rej) => {
      const tx = db.transaction('photos','readwrite');
      tx.objectStore('photos').delete(id);
      tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
    });
  }
  function getAllKeys() {
    return new Promise((res,rej) => {
      const tx = db.transaction('photos','readonly');
      const r = tx.objectStore('photos').getAllKeys();
      r.onsuccess = () => res(r.result);
      r.onerror = ()=>rej(r.error);
    });
  }
  return {open,put,url,del,getAllKeys};
})();

// PERSISTENCE
// ═══════════════════════════════════════════
function save() {
  localStorage.setItem('garden_zones',   JSON.stringify(S.zones));
  localStorage.setItem('garden_records', JSON.stringify(S.records));
}
function load() {
  try { S.zones   = JSON.parse(localStorage.getItem('garden_zones'))   || defZones(); } catch { S.zones   = defZones(); }
  try { S.records = JSON.parse(localStorage.getItem('garden_records')) || []; }          catch { S.records = []; }
  try { S.gh      = JSON.parse(localStorage.getItem('garden_gh'))      || {}; }          catch { S.gh = {}; }
}
function defZones() {
  return [
    {id:'z1',name:'ロックガーデン'},
    {id:'z2',name:'フロントガーデン'},
    {id:'z3',name:'菜園'},
    {id:'z4',name:'その他'},
  ];
}

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function today() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) {
  if(!d) return '';
  const [y,m,dy] = d.split('-');
  return `${y}年${+m}月${+dy}日`;
}
function isOverdue(d) { return !!d && d < today(); }
function zoneName(id) { return (S.zones.find(z=>z.id===id)||{name:id}).name; }
function typeLabel(t) { return {soil:'土づくり',plant:'植物',task:'タスク'}[t]||t; }
function typeIcon(t)  { return {soil:'🪨',plant:'🌱',task:'✅'}[t]||'📝'; }
function plantLabel(t){ return {vegetable:'野菜',flower:'花',herb:'ハーブ',tree:'樹木',other:'その他'}[t]||t; }
function statusLabel(s){ return {new:'新規',update:'追記',edit:'修正',done:'完了'}[s]||s; }
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2500);
}

// RENDER HELPERS
// ═══════════════════════════════════════════
function recordHTML(r) {
  const last = r.timeline?.at(-1);
  const lastDate = last?.date || r.createdAt;
  const overdue = r.type==='task' && !r.completed && isOverdue(r.dueDate);

  let meta = `<span>${esc(zoneName(r.zoneId))}</span>`;
  if(r.type==='plant' && r.plantType)
    meta += `<span class="badge b-${r.plantType}">${plantLabel(r.plantType)}</span>`;
  if(r.type==='task' && r.dueDate)
    meta += `<span class="${overdue?'overdue-txt':''}">期日: ${fmtDate(r.dueDate)}${overdue?' ⚠️':''}</span>`;
  meta += `<span>${fmtDate(lastDate)}</span>`;

  const preview = last?.comment
    ? `<div class="ri-preview">${esc(last.comment)}</div>` : '';

  return `<div class="record-item type-${r.type}${r.completed?' completed':''}${overdue?' overdue':''}" data-id="${r.id}">
    <div class="ri-head">
      <div class="ri-icon">${typeIcon(r.type)}</div>
      <div class="ri-info">
        <div class="ri-title">${esc(r.title)}</div>
        <div class="ri-meta">${meta}</div>
      </div>
      <span class="badge b-${r.type}">${typeLabel(r.type)}</span>
    </div>
    ${preview}
  </div>`;
}

function attachClicks(container) {
  container.querySelectorAll('.record-item').forEach(el =>
    el.addEventListener('click', ()=>openDetail(el.dataset.id))
  );
}

function sortByLatest(arr) {
  return [...arr].sort((a,b)=>{
    const ad = a.timeline?.at(-1)?.date || a.createdAt;
    const bd = b.timeline?.at(-1)?.date || b.createdAt;
    return bd.localeCompare(ad);
  });
}

function emptyHTML(icon, msg) {
  return `<div class="empty"><div class="ei">${icon}</div><p>${msg}</p></div>`;
}

// ═══════════════════════════════════════════
// TAB: TASK
// ═══════════════════════════════════════════
function renderTask() {
  const pending = S.records.filter(r=>r.type==='task'&&!r.completed)
    .sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
  const done = S.records.filter(r=>r.type==='task'&&r.completed)
    .sort((a,b)=>(b.dueDate||'').localeCompare(a.dueDate||''));

  const el = document.getElementById('taskList');
  if(!pending.length && !done.length) {
    el.innerHTML = emptyHTML('✅','タスクがありません'); return;
  }
  let h = '';
  if(pending.length) h += `<div class="sec-hdr">未完了 (${pending.length})</div>`+pending.map(taskHTML).join('');
  if(done.length)    h += `<div class="sec-hdr">完了 (${done.length})</div>`+done.map(taskHTML).join('');
  el.innerHTML = h;

  el.querySelectorAll('.task-chk').forEach(btn =>
    btn.addEventListener('click', e=>{ e.stopPropagation(); toggleTask(btn.dataset.id); })
  );
  el.querySelectorAll('.task-inner').forEach(btn =>
    btn.addEventListener('click', ()=>openDetail(btn.dataset.id))
  );
}

function taskHTML(r) {
  const ov = !r.completed && isOverdue(r.dueDate);
  return `<div class="task-item${ov?' overdue':''}${r.completed?' done-task':''}">
    <div class="task-inner" data-id="${r.id}">
      <div class="task-chk${r.completed?' done':''}" data-id="${r.id}">${r.completed?'✓':''}</div>
      <div style="flex:1;min-width:0;">
        <div class="ri-title">${esc(r.title)}</div>
        <div class="ri-meta">
          <span>${esc(zoneName(r.zoneId))}</span>
          ${r.dueDate?`<span class="${ov?'overdue-txt':''}">期日: ${fmtDate(r.dueDate)}${ov?' ⚠️':''}</span>`:''}
        </div>
      </div>
    </div>
  </div>`;
}

function toggleTask(id) {
  const r = S.records.find(r=>r.id===id); if(!r) return;
  r.completed = !r.completed;
  (r.timeline=r.timeline||[]).push({
    id:uid(), date:today(),
    status: r.completed?'done':'update',
    comment: r.completed?'完了にしました':'未完了に戻しました',
    photoIds:[]
  });
  save(); renderTask();
}

function showZoneSheet() { document.getElementById('newZoneName').value=''; openSheet('zone'); }
function addZone() {
  const name = document.getElementById('newZoneName').value.trim();
  if(!name){ toast('ゾーン名を入力してください'); return; }
  S.zones.push({id:uid(),name});
  save(); closeSheet('zone'); renderSummary(); toast('ゾーンを追加しました ✓');
}
function deleteZone(id) {
  const z = S.zones.find(z=>z.id===id); if(!z) return;
  if(!confirm(`「${z.name}」を削除しますか？\nこのゾーンの記録は先頭ゾーンに移動します。`)) return;
  S.zones = S.zones.filter(z=>z.id!==id);
  const fallback = S.zones[0]?.id||'other';
  S.records.forEach(r=>{ if(r.zoneId===id) r.zoneId=fallback; });
  save(); renderSummary(); toast('削除しました');
}

function matRowHTML() {
  return `<div class="mat-row">
    <input type="text" class="finput" placeholder="種類（腐葉土など）" data-f="type">
    <input type="text" class="finput amt" placeholder="量" data-f="amount">

    </select>
    <button class="rm-mat" onclick="this.parentElement.remove()">×</button>
  </div>`;
}
function addMatRow(container) { container.insertAdjacentHTML('beforeend',matRowHTML()); }

async function handlePhotos(e, photosArr, gridId) {
  for(const file of e.target.files) {
    const id = uid();
    const url = URL.createObjectURL(file);
    photosArr.push({id,blob:file,url});
    await PDB.put(id,file);
  }
  renderPhotoGrid(gridId, photosArr);
  e.target.value='';
}

function renderPhotoGrid(gridId, arr) {
  const el = document.getElementById(gridId); if(!el) return;
  el.innerHTML = arr.map(p=>`
    <div class="photo-item">
      <img src="${p.url}" alt="">
      <button class="rm-photo" data-pid="${p.id}">×</button>
    </div>`).join('');
  el.querySelectorAll('.rm-photo').forEach(b=>{
    b.addEventListener('click',()=>{
      const idx = arr.findIndex(p=>p.id===b.dataset.pid);
      if(idx>=0){ PDB.del(arr[idx].id); arr.splice(idx,1); renderPhotoGrid(gridId,arr); }
    });
  });
}

function getMats(containerId) {
  return Array.from(document.querySelectorAll(`#${containerId} .mat-row`)).map(row=>({
    type:   row.querySelector('[data-f="type"]').value.trim(),
    amount: row.querySelector('[data-f="amount"]').value.trim(),
    unit:   row.querySelector('[data-f="unit"]').value,
  })).filter(m=>m.type);
}

async function saveRecord() {
  const type = document.querySelector('#addBody .type-btn.sel')?.dataset.type||'plant';
  const title = document.getElementById('aTitle')?.value.trim();
  const zone  = document.getElementById('aZone').value;
  const date  = document.getElementById('aDate').value || today();
  const comment = document.getElementById('aComment').value.trim();

  if(type!=='soil' && !title){ toast('名前を入力してください'); return; }

  const entry = {
    id:uid(), date, status:'new', comment,
    photoIds: addPhotos.map(p=>p.id)
  };
  if(type==='soil') entry.materials = getMats('matCont');

  const rec = {
    id:uid(), type, zoneId:zone,
    title: title || ('土づくり '+fmtDate(date)),
    createdAt: date,
    timeline: [entry]
  };
  if(type==='plant') rec.plantType = document.getElementById('aPlantType')?.value;
  if(type==='task')  { rec.dueDate = document.getElementById('aDue')?.value||''; rec.completed=false; }

  S.records.push(rec);
  save(); addPhotos=[]; closeSheet('add'); renderTab(); toast('保存しました ✓');
  if(S.gh.token) syncToGh(true);
}

// RECORD DETAIL
// ═══════════════════════════════════════════
async function openDetail(id) {
  curRecId = id;
  const r = S.records.find(r=>r.id===id); if(!r) return;
  document.getElementById('detailTitle').textContent = r.title;
  document.getElementById('detailBody').innerHTML = `<div class="loading"><div class="spinner"></div> 読み込み中...</div>`;
  openSheet('detail');
  document.getElementById('detailBody').innerHTML = await buildDetail(r);
  // photo clicks
  document.querySelectorAll('#detailBody .tl-photo').forEach(img=>
    img.addEventListener('click',()=>{ document.getElementById('viewerImg').src=img.src; document.getElementById('imgViewer').style.display='flex'; })
  );
  document.getElementById('addTlBtn')?.addEventListener('click',()=>showTlSheet(id));
  document.getElementById('delRecBtn')?.addEventListener('click',()=>deleteRecord(id));
}

async function buildDetail(r) {
  const badges = [
    `<span class="badge b-${r.type}">${typeLabel(r.type)}</span>`,
    `<span class="badge" style="background:#e8f5e9;color:#2d6a3f;">🏡 ${esc(zoneName(r.zoneId))}</span>`,
    r.plantType ? `<span class="badge b-${r.plantType}">${plantLabel(r.plantType)}</span>` : '',
    r.type==='task'&&r.dueDate ? `<span class="badge ${!r.completed&&isOverdue(r.dueDate)?'b-overdue':''}">期日: ${fmtDate(r.dueDate)}</span>` : '',
    r.completed ? `<span class="badge b-done">完了</span>` : '',
  ].filter(Boolean).join(' ');

  let html = `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">${badges}</div>`;
  html += `<button class="add-tl-btn" id="addTlBtn">＋ 追記する</button>`;
  html += `<div class="sec-hdr" style="padding-top:12px;">タイムライン</div>`;
  html += `<div class="timeline">`;

  for(const entry of [...(r.timeline||[])].reverse()) {
    let photos = '';
    if(entry.photoIds?.length) {
      const imgs = await Promise.all(entry.photoIds.map(async pid=>{
        const u = await PDB.url(pid);
        return u ? `<img class="tl-photo" src="${u}" alt="" loading="lazy">` : '';
      }));
      photos = `<div class="tl-photos">${imgs.join('')}</div>`;
    }
    const mats = entry.materials?.length
      ? `<div class="tl-materials">${entry.materials.map(m=>`<div class="mat-item">• ${esc(m.type)}${m.amount?' '+esc(m.amount)+m.unit:''}</div>`).join('')}</div>` : '';

    html += `<div class="tl-entry">
      <div class="tl-dot"></div>
      <div class="tl-card">
        <div class="tl-date">${fmtDate(entry.date)} <span class="badge b-${entry.status}" style="margin-left:4px;">${statusLabel(entry.status)}</span></div>
        ${entry.comment?`<div class="tl-comment">${esc(entry.comment)}</div>`:''}
        ${mats}${photos}
      </div>
    </div>`;
  }
  html += `</div>`;
  html += `<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);">
    <button class="del-btn" id="delRecBtn">この記録を削除</button>
  </div>`;
  return html;
}

function deleteRecord(id) {
  const r = S.records.find(r=>r.id===id); if(!r) return;
  if(!confirm(`「${r.title}」を削除しますか？`)) return;
  S.records = S.records.filter(r=>r.id!==id);
  save(); closeSheet('detail'); renderTab(); toast('削除しました');
}

// ═══════════════════════════════════════════
// TIMELINE ENTRY
// ═══════════════════════════════════════════
function showTlSheet(recId) {
  tlPhotos = []; curRecId = recId;
  const r = S.records.find(r=>r.id===recId);
  const isSoil = r?.type==='soil';

  document.getElementById('tlBody').innerHTML = `
    <div class="fg">
      <label class="flabel">日付</label>
      <input type="date" class="finput" id="tlDate" value="${today()}">
    </div>
    <div class="fg">
      <label class="flabel">ステータス</label>
      <select class="fselect" id="tlStatus">
        <option value="update">追記</option>
        <option value="done">完了</option>
        <option value="edit">修正</option>
        <option value="new">新規</option>
      </select>
    </div>
    <div class="fg">
      <label class="flabel">コメント</label>
      <textarea class="ftextarea" id="tlComment" placeholder="観察記録、変化など..."></textarea>
    </div>
    ${isSoil?`
    <div class="fg">
      <label class="flabel">使用した資材（任意）</label>
      <div id="tlMatCont"></div>
      <button type="button" class="btn-sm" id="tlAddMat">＋ 資材を追加</button>
    </div>`:''}
    <div class="fg">
      <label class="flabel">写真</label>
      <div class="photo-drop">📷 タップして写真を追加<input type="file" accept="image/*" multiple id="tlPhotoIn"></div>
      <div class="photo-grid" id="tlPhotoGrid"></div>
    </div>
    <button class="btn-p" id="tlSaveBtn">追記を保存</button>
  `;

  if(isSoil) {
    const mc = document.getElementById('tlMatCont');
    addMatRow(mc);
    document.getElementById('tlAddMat').addEventListener('click',()=>addMatRow(mc));
  }
  document.getElementById('tlPhotoIn').addEventListener('change', e=>handlePhotos(e,tlPhotos,'tlPhotoGrid'));
  document.getElementById('tlSaveBtn').addEventListener('click', saveTlEntry);
  openSheet('tl');
}

async function saveTlEntry() {
  const r = S.records.find(r=>r.id===curRecId); if(!r) return;
  const entry = {
    id:uid(),
    date:    document.getElementById('tlDate').value,
    status:  document.getElementById('tlStatus').value,
    comment: document.getElementById('tlComment').value.trim(),
    photoIds: tlPhotos.map(p=>p.id),
  };
  const mc = document.getElementById('tlMatCont');
  if(mc) entry.materials = getMats('tlMatCont');
  if(r.type==='task' && entry.status==='done') r.completed = true;
  (r.timeline=r.timeline||[]).push(entry);
  save(); tlPhotos=[]; closeSheet('tl'); toast('追記しました ✓');
  await openDetail(curRecId);
  if(S.gh.token) syncToGh(true);
}

// ═══════════════════════════════════════════
// GITHUB SYNC
// ═══════════════════════════════════════════
function saveGhSettings() {
  S.gh = {
    token: document.getElementById('ghToken').value.trim(),
    repo:  document.getElementById('ghRepo').value.trim(),
    path:  document.getElementById('ghPath').value.trim()||'garden-data.json',
  };
  localStorage.setItem('garden_gh', JSON.stringify(S.gh));
  toast('設定を保存しました ✓');
}

async function ghAPI(method, body) {
  const {token,repo,path} = S.gh;
  if(!token||!repo) { toast('GitHub設定を入力してください'); return null; }
  const [owner,repoName] = repo.split('/');
  const url = `https://api.github.com/repos/${owner}/${repoName}/contents/${path}`;
  const res = await fetch(url, {
    method,
    headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : undefined,
  });
  if(!res.ok && res.status!==404) throw new Error(`HTTP ${res.status}`);
  return res.status===404 ? null : res.json();
}

async function syncToGh(silent=false) {
  if(!S.gh.token||!S.gh.repo) { if(!silent) toast('GitHub設定を入力してください'); return; }
  if(!silent) document.getElementById('syncStatus').textContent = '同期中...';
  try {
    const existing = await ghAPI('GET');
    const sha = existing?.sha;
    const content = btoa(unescape(encodeURIComponent(JSON.stringify({zones:S.zones,records:S.records,updatedAt:new Date().toISOString()},null,2))));
    await ghAPI('PUT', {message:`庭DIY sync ${new Date().toLocaleString('ja-JP')}`,content,...(sha?{sha}:{})});
    const t = new Date().toLocaleTimeString('ja-JP');
    document.getElementById('syncStatus').textContent = `最終同期: ${t}`;
    if(!silent) toast('同期しました ✓');
  } catch(e) {
    document.getElementById('syncStatus').textContent = `エラー: ${e.message}`;
    if(!silent) toast('同期に失敗しました');
  }
}

async function syncFromGh() {
  if(!S.gh.token||!S.gh.repo) { toast('GitHub設定を入力してください'); return; }
  document.getElementById('syncStatus').textContent = '取得中...';
  try {
    const data = await ghAPI('GET');
    if(!data) { toast('リモートにデータがありません'); return; }
    const remote = JSON.parse(atob(data.content.replace(/\n/g,'')));
    // Merge: add records/zones not locally present
    const localIds = new Set(S.records.map(r=>r.id));
    (remote.records||[]).forEach(r=>{ if(!localIds.has(r.id)) S.records.push(r); });
    const localZIds = new Set(S.zones.map(z=>z.id));
    (remote.zones||[]).forEach(z=>{ if(!localZIds.has(z.id)) S.zones.push(z); });
    save(); renderTab();
    const t = new Date().toLocaleTimeString('ja-JP');
    document.getElementById('syncStatus').textContent = `取得完了: ${t}`;
    toast('データを取得しました ✓');
  } catch(e) {
    document.getElementById('syncStatus').textContent = `エラー: ${e.message}`;
    toast('取得に失敗しました');
  }
}

// ═══════════════════════════════════════════
// BACKUP
// ═══════════════════════════════════════════
function exportJSON() {
  const blob = new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),zones:S.zones,records:S.records},null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `garden-backup-${today()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('エクスポートしました ✓');
}

function importJSON(e) {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if(!data.records) throw new Error('invalid');
      if(!confirm(`インポートしますか？\n既存データは保持され、新しいデータが追加されます。`)) return;
      const localIds = new Set(S.records.map(r=>r.id));
      let added = 0;
      (data.records||[]).forEach(r=>{ if(!localIds.has(r.id)){ S.records.push(r); added++; } });
      const localZIds = new Set(S.zones.map(z=>z.id));
      (data.zones||[]).forEach(z=>{ if(!localZIds.has(z.id)) S.zones.push(z); });
      save(); renderTab(); toast(`${added}件インポートしました ✓`);
    } catch { toast('インポートに失敗しました'); }
  };
  reader.readAsText(file);
  e.target.value='';
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
async function init() {
  await PDB.open();
  load();

  document.querySelectorAll('.tab-item').forEach(el=>
    el.addEventListener('click',()=>switchTab(el.dataset.tab))
  );
  document.getElementById('fabBtn').addEventListener('click',()=>showAddSheet());
  document.getElementById('syncBtn').addEventListener('click',()=>{
    if(S.gh.token&&S.gh.repo) syncFromGh();
    else { switchTab('summary'); toast('まとめタブでGitHub設定を行ってください'); }
  });
  document.getElementById('filterType').addEventListener('change',renderAll);
  document.getElementById('filterZone').addEventListener('change',renderAll);

  // overlay clicks close sheets
  [['add','addOverlay'],['detail','detailOverlay'],['tl','tlOverlay'],['zone','zoneOverlay']].forEach(([n,oid])=>{
    document.getElementById(oid).addEventListener('click',()=>closeSheet(n));
  });

  renderAll();

  if(S.gh.token&&S.gh.repo) syncFromGh();

  if('serviceWorker' in navigator)
    navigator.serviceWorker.register('sw.js').catch(()=>{});
}

init();
</script>
